name: ESPN probe

# Triage tool for the daily collector's runner-side 403s: run this from the
# Actions tab and read the log to see which ESPN host + header combination a
# GitHub-hosted runner can actually reach. The fix belongs in espn_api.py's
# _HEADER_SETS, so the answer here drives that one place.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Probe ESPN endpoints with curl
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          probe() {
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "${@:3}" "$2" || echo "ERR")
            echo "$1 -> $code"
          }
          probe "site.api/default-ua"            "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams"
          probe "site.api/browser-ua"             "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams" -A "$UA" -H "Accept: application/json" -H "Referer: https://www.nba.com/"
          probe "site.api/no-ua"                  "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams" -A ""
          probe "site.web.api/browser-ua"         "https://site.web.api.espn.com/apis/site/v2/sports/basketball/nba/teams" -A "$UA" -H "Accept: application/json" -H "Referer: https://www.nba.com/"
          probe "site.web.api/default-ua"         "https://site.web.api.espn.com/apis/site/v2/sports/basketball/nba/teams"
          probe "sports.core.api/browser-ua"      "https://sports.core.api.espn.com/v2/sports/basketball/leagues/nba/teams" -A "$UA" -H "Accept: application/json" -H "Referer: https://www.nba.com/"
      - name: Probe ESPN with every project header set
        run: |
          python - <<'PY'
          import sys
          import urllib.error
          import urllib.request
          sys.path.insert(0, "src/collector")
          import espn_api

          url = ("https://site.api.espn.com/apis/site/v2/sports/"
                 "basketball/nba/teams")
          for i, headers in enumerate(espn_api._HEADER_SETS):
              label = ("honest-default", "curl-ua", "browser-ua")[i]
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      print(f"py/site.api/{label} -> {resp.status}")
              except urllib.error.HTTPError as exc:
                  print(f"py/site.api/{label} -> {exc.code}")
              except Exception as exc:  # noqa: BLE001 -- probe output
                  print(f"py/site.api/{label} -> {type(exc).__name__}: {exc}")
          PY
