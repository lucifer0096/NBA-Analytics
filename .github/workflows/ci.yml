name: CI

on:
  push:
    branches: [main]
    # The collector commits refreshed fallback data to main daily; re-running
    # the suite on those pushes exercises no code (only data/dashboard_* and
    # models/* content changed), so skip when EVERY changed file is data or a
    # retrained model. A push touching anything else still runs CI --
    # paths-ignore only suppresses runs when no other path is part of the
    # same push.
    paths-ignore:
      - "data/**"
      - "models/**"
  pull_request:
  # Manual trigger from the gh CLI (`gh workflow run CI`) -- without this the
  # dispatch call fails with HTTP 422 "Workflow does not have
  # 'workflow_dispatch' trigger".
  workflow_dispatch:
  # Weekly run (Mondays 06:00 UTC): catches dependency/environment drift
  # even in weeks when no code lands on main -- paths-ignore never applies
  # to scheduled runs, so this always exercises the full suite.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.12+ is required: requirements.txt pins numpy==2.5.3, which
          # declares requires_python>=3.12 and ships no cp311 wheel. 3.14
          # matches the Streamlit Cloud runtime the app actually deploys on.
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        # ruff.toml pins the rule set, so this resolves the same rules a
        # local `ruff check app src` does.
        run: ruff check app src
      - name: Compile Python
        run: python -m compileall -q app src
      - name: Run tests
        # pytest.ini's testpaths + its `-m "not live"` default make this the
        # deterministic suite (unit tests + the offline dashboard/AppTest
        # render tests). The live ESPN-API checks are marked `live` and run
        # on demand with `pytest -m live`. The --cov flags keep a coverage
        # report per run: the XML is uploaded as an artifact and the total
        # lands in the step summary (information, not a threshold gate --
        # a floor would reward covering trivial lines, not protecting the
        # honesty assertions this suite actually pins).
        run: >-
          python -m pytest -q
          --cov=app --cov=src
          --cov-report=term --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 30
      - name: Coverage in the step summary
        if: always()
        run: |
          [ -f coverage.xml ] || exit 0
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import xml.etree.ElementTree as ET
          line = ET.parse("coverage.xml").getroot()
          assert line.tag == "coverage", line.tag
          print("### Coverage")
          print(f"{float(line.get('line-rate')) * 100:.1f}% lines "
                f"({line.get('lines-covered')}/{line.get('lines-valid')}) "
                "-- full report in the coverage-report artifact.")
          PY
