name: Daily collector

# NBA games happen daily (Oct-Apr) and the WNBA's run May-Oct, and the ESPN
# APIs are free/unauthenticated, so a daily run keeps both leagues' data
# current: refresh each league's current-season schedule and standings, fetch
# any newly-finalized game box scores, refresh the dashboard fallback files
# (both leagues in one pass), and commit the results back to main (the same
# pattern as FPL-Analytics' collector workflow). In either league's offseason
# the run is nearly a no-op: no new final games, so it only rewrites the
# schedule/standings copies.
on:
  schedule:
    - cron: "20 12 * * *"   # 12:20 UTC daily -- after most US games finish
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  # Shared with refresh-history.yml and retrain.yml: those also push to
  # main, so one group serializes every data/model push instead of letting
  # two jobs race the same ref and fail half-way with a rejected push.
  group: data-refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Branch tip, not the default ${{ github.sha }}: for schedule and
          # workflow_dispatch runs that SHA is pinned when the run is
          # CREATED, so a run queued behind another push (this workflow
          # shares the data-refresh concurrency group with the collector)
          # starts stale and its final `git push` gets rejected -- the run
          # fails with its refreshed work stranded. Taking main at job
          # start removes that race.
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run collector (NBA, current season, incremental)
        # Schedule + newly-final games for the seasons the state file tracks
        # (defaults to the current season only -- historical backfills are a
        # deliberate one-off local command, see docs/COLLECTOR.md).
        run: python src/collector/snapshot.py --season current
      - name: Run collector (WNBA, current season, incremental)
        # Same policy, its own state file under data/raw_wnba: season label =
        # calendar year, historical backfills are one-off local runs too.
        run: python src/collector/snapshot.py --league wnba --season current
      - name: Refresh dashboard fallbacks (both leagues)
        run: python src/collector/refresh_dashboard_fallbacks.py --league nba wnba
      - name: Commit refreshed data
        run: |
          git config user.name "collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: daily collector refresh $(date -u +%F)"
            git push
          fi
      - name: Open or update the failure issue
        # A silent dead collector is the worst failure mode (data just goes
        # stale): on ANY failed step, upsert one tracked issue that links the
        # failing run (shared script with refresh-history.yml/retrain.yml).
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          bash .github/scripts/upsert_failure_issue.sh
          "Daily collector failing (data going stale)"
          "$RUN_URL"
          "For ESPN reachability triage, dispatch the ESPN probe workflow and read its log; the fix belongs in src/collector/espn_api.py (_HEADER_SETS)."
