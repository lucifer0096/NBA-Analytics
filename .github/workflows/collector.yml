name: Daily collector

# NBA games happen daily (Oct-Apr) and the ESPN APIs are free/unauthenticated,
# so a daily run keeps data/raw current: refresh the current season's schedule
# and standings, fetch any newly-finalized game box scores, refresh the
# dashboard fallback files, and commit the results back to main (the same
# pattern as FPL-Analytics' collector workflow). In the offseason (Jun-Sep)
# the run is nearly a no-op: no new final games, so it only rewrites the
# schedule/standings copies.
on:
  schedule:
    - cron: "20 12 * * *"   # 12:20 UTC daily -- after most US games finish
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  # Shared with refresh-history.yml and retrain.yml: those also push to
  # main, so one group serializes every data/model push instead of letting
  # two jobs race the same ref and fail half-way with a rejected push.
  group: data-refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run collector (current season, incremental)
        # Schedule + newly-final games for the seasons the state file tracks
        # (defaults to the current season only -- historical backfills are a
        # deliberate one-off local command, see docs/COLLECTOR.md).
        run: python src/collector/snapshot.py --season current
      - name: Refresh dashboard fallbacks
        run: python src/collector/refresh_dashboard_fallbacks.py
      - name: Commit refreshed data
        run: |
          git config user.name "collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: daily collector refresh $(date -u +%F)"
            git push
          fi
      - name: Open or update the failure issue
        # A silent dead collector is the worst failure mode (data just goes
        # stale): on ANY failed step, upsert one tracked issue that links the
        # failing run, so the repo's inbox says so without polling Actions.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          title="Daily collector failing (data going stale)"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                  --json number,title --jq '.[] | "\(.number) \(.title)"' \
                | grep -F "$title" | awk '{print $1}' | head -1)
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" \
              --body "Failed again: $run_url"
          else
            body=$(printf '%s\n\n%s' \
              "The scheduled collector failed, so committed data stays at the last successful refresh. Newest failing run: $run_url" \
              "For ESPN reachability triage, dispatch the ESPN probe workflow and read its log; the fix belongs in src/collector/espn_api.py (_HEADER_SETS).")
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "$body"
          fi
