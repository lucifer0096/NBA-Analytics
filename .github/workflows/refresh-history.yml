name: Weekly history refresh

# Insurance for the all-history half of the pipeline: the daily collector
# already refreshes history_cache/dashboard_awards/dashboard_players on
# every run, but if the daily cron is down for days this Sunday run still
# renews ESPN's TTL-cached career/honours data and the committed fallbacks
# (refresh_awards rebuilds local seasons and preserves the rest, so a
# one-season CI checkout is safe -- see its docstring). Same
# snapshot + refresh + commit sequence as collector.yml: the snapshot step
# is what gives refresh_awards a current-season box set to rebuild from.
# Serialized with every other data/model push via the shared group.
on:
  schedule:
    - cron: "40 4 * * 0"   # Sunday 04:40 UTC (quiet spot between daily runs)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Branch tip, not the default ${{ github.sha }}: for schedule and
          # workflow_dispatch runs that SHA is pinned when the run is
          # CREATED, so this run -- queued behind the daily collector on
          # the shared data-refresh group -- started stale and its final
          # `git push` was rejected (run failed, work stranded, issue #2).
          # Taking main at job start removes that race.
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Snapshot the current seasons (schedule + newly-final games)
        run: |
          python src/collector/snapshot.py --season current
          python src/collector/snapshot.py --league wnba --season current
      - name: Refresh dashboard fallbacks (both leagues, incl. all-history)
        run: python src/collector/refresh_dashboard_fallbacks.py --league nba wnba
      - name: Commit refreshed data
        run: |
          git config user.name "collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: weekly history refresh $(date -u +%F)"
            git push
          fi
      - name: Open or update the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          bash .github/scripts/upsert_failure_issue.sh
          "Weekly history refresh failing (data going stale)"
          "$RUN_URL"
