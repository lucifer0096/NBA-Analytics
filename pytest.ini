[pytest]
# One meaning for a bare `pytest -q`, locally and in CI:
# - testpaths covers every directory that actually holds tests;
# - live tests (marked below) are EXCLUDED by default, since they hit ESPN's
#   real API. Run them explicitly with `pytest -m live`.
testpaths = src app
addopts = -m "not live"
markers =
    live: exercises ESPN's real API (run with: pytest -m live)
